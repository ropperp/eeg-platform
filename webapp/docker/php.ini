upload_max_filesize = 20M
post_max_size = 20M
session.save_handler = redis
; session.save_path wird NICHT hier statisch gesetzt, sondern zur Laufzeit in Auth::start()
; per ini_set() -- so kann dort bei Bedarf ein Redis-Passwort (?auth=...) eingebaut werden
; (siehe scripts/redis_secure_setup.sh), ohne diese Datei bei jeder Passwortänderung neu bauen
; zu müssen. Ohne REDIS_PASSWORD in der Umgebung verbindet sich Auth::start() weiterhin genauso
; wie bisher hier (tcp://redis:6379, kein Passwort) -- rückwärtskompatibel.
;
; session.use_strict_mode: verwirft eine vom Client mitgeschickte Session-ID, die der Server nie
; selbst ausgegeben hat, statt sie unbedarft zu übernehmen -- Standardhärtung gegen
; Session-Fixation (OWASP Session Management Cheat Sheet), PHP-Default ist "aus".
session.use_strict_mode = 1
date.timezone = Europe/Vienna

; Wichtig: das Basis-Image (php:8.2-fpm-alpine) lädt kein php.ini-production/-development,
; nur diese eine Datei. Ohne display_errors=Off greift PHPs eincompilierter Default
; (display_errors=On) -- jede Warning/Notice landet dann MITTEN im HTTP-Response, noch bevor
; z.B. header('Location: ...') aufgerufen wird ("headers already sent"), und zerstört die
; Antwort (das war die Ursache mehrerer "500"-Meldungen, die eigentlich harmlose Warnings
; waren). Fehler werden stattdessen geloggt (docker compose logs webapp); der eigene globale
; Error-Handler in index.php zeigt Details weiterhin gezielt für eingeloggte Nutzer an.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Versteckt den "X-Powered-By: PHP/x.y.z"-Response-Header (Security-Review 25.09.2026) --
; PHP-Default ist "On", verrät sonst die exakte PHP-Version an jeden Besucher/Scanner,
; gleiches Prinzip wie server_tokens off; für nginx nebenan.
expose_php = Off

; Interims-Mitigation gegen CVE-2026-109618/CVE-2026-109619 ("PHP2Shell", veröffentlicht
; 21.10.2026, CVSS 9.2) -- eine unauthentifizierte Remote-Code-Execution-Lücke in PHPs eigenem
; multipart/form-data-Parser, auslösbar über das Feature "session.upload_progress" bei JEDEM
; Datei-Upload-Endpunkt (bei uns z.B. Mitglieder-Avatar, EDA-Import, Beitrittserklärung-Upload,
; /admin/templates). Der echte Fix ist ausschließlich ein PHP-Upgrade (8.2.35, 8.3.36, 8.4.27
; bzw. 8.5.12) -- das offizielle Docker-Image php:8.2-fpm-alpine lieferte zum Zeitpunkt dieses
; Commits trotz frisch gezogenem Image noch PHP 8.2.34 aus (Docker Hub hat die gepatchte
; Alpine-Variante offenbar noch nicht veröffentlicht). Bis dahin deaktiviert dieses Flag das
; verwundbare Feature komplett -- laut PHP-Kernteam (Gina Peter Banyard) KEIN vollständiger
; Ersatz für das Upgrade, nur ein Teil-Workaround, der den HAUPT-Angriffsweg schließt. Bewusst
; hier (als statischer, beim FPM-Worker-Start geladener php.ini-Wert) gesetzt und NICHT per
; ini_set()/.user.ini -- laut Advisory greifen beide zu spät, weil die verwundbare Stelle schon
; VOR der eigentlichen Anwendung ausgeführt wird.
; TODO: sobald php:8.2-fpm-alpine (oder eine neuere, hier verwendete PHP-Minor-Version) laut
; `docker compose exec webapp php -v` 8.2.35/8.3.36/8.4.27/8.5.12 oder neuer zeigt, diesen
; Block wieder entfernen (reines Aufräumen, kein Sicherheitsrisiko, ihn noch eine Weile stehen
; zu lassen).
session.upload_progress.enabled = Off
