user www-data;
worker_processes auto;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 20M;
    # Versteckt "nginx/x.y.z" in Server-Headern/Fehlerseiten (Security-Review 25.09.2026) --
    # kein Sicherheitsgewinn im engeren Sinn, aber unnötige Versionspreisgabe an Angreifer/
    # automatisierte Scanner vermeiden (stand vorher offen sichtbar in externen Site-Checks).
    server_tokens off;

    # Komprimierung nur für statische Dateien (Stylesheets, Skripte, SVG) -- spart auf dem Handy
    # spürbar Übertragung (app.css ~64 KB). Achtung: text/html komprimiert nginx bei "gzip on"
    # IMMER, auch wenn es nicht in gzip_types steht. Deshalb schaltet der PHP-Block unten gzip
    # ausdrücklich ab: dynamische Seiten und JSON enthalten den CSRF-Code, und komprimierte
    # Antworten mit Geheimnis + eingespiegelten Eingaben sind für den BREACH-Angriff anfällig.
    # Geprüft durch tests/http/headers_test.sh.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/manifest+json;

    # webapp terminiert selbst nie TLS -- das macht ausschließlich der externe nginx-Proxy
    # (10.0.0.144), der per proxy_set_header X-Forwarded-Proto https; weiterreicht.
    # $_SERVER['HTTPS'] in PHP (siehe Auth.php: session_set_cookie_params 'secure' =>
    # isset($_SERVER['HTTPS'])) war dadurch in Produktion IMMER leer, obwohl die Seite über
    # HTTPS läuft -- das Session-Cookie bekam nie das Secure-Flag (Security-Review 25.09.2026).
    # Bewusst per map statt fix "on", damit lokale Entwicklung über
    # docker-compose.override.yml (direkter Plain-HTTP-Zugriff ohne X-Forwarded-Proto) weiterhin
    # funktioniert, statt ein Secure-Cookie zu setzen, das der Browser über HTTP nie zurückschickt.
    map $http_x_forwarded_proto $fastcgi_https {
        default '';
        https   'on';
    }

    # Lange Cache-Dauer ("immutable") nur für Assets mit Versionsparameter (?v=..., siehe
    # assetUrl() in functions.php) -- deren URL ändert sich bei jeder Dateiänderung. Ohne ?v= nur
    # kurz cachen und danach nachfragen, sonst behält ein Browser nach einem Update alte Skripte.
    map $arg_v $static_cache_control {
        ''      'public, max-age=3600, must-revalidate';
        default 'public, max-age=31536000, immutable';
    }

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Security-Header (Clickjacking, nosniff, HSTS, ...): siehe security-headers.conf.
        include /etc/nginx/security-headers.conf;

        # Health-Check
        location = /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # robots.txt / security.txt (RFC 9116) -- Security-Review 25.09.2026, F-08. Explizite
        # Content-Type-Zuweisung nötig: .txt steht nicht in mime.types, ohne das würde nginx
        # sonst den globalen default_type (application/octet-stream) ausliefern und Browser/Bots
        # böten die Datei zum Download an statt sie als Text zu interpretieren.
        location = /robots.txt {
            default_type text/plain;
        }
        location = /llms.txt {
            default_type text/plain;
        }
        location = /.well-known/security.txt {
            default_type text/plain;
        }
        # sitemap.xml/site.webmanifest: gleicher Grund wie bei robots.txt oben -- .xml/
        # .webmanifest stehen nicht in nginx' Standard-mime.types, ohne explizite Zuweisung
        # würde nginx sonst den globalen default_type (application/octet-stream) ausliefern.
        location = /sitemap.xml {
            default_type application/xml;
        }
        location = /site.webmanifest {
            default_type application/manifest+json;
        }

        # Alle Requests durch den PHP-Router
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            # nginx leitet den Authorization-Header NICHT automatisch an PHP-FPM weiter (auch
            # nicht über "include fastcgi_params" -- bekannte nginx+fastcgi-Falle). Ohne diese
            # Zeile käme $_SERVER['HTTP_AUTHORIZATION'] in PHP immer leer an, egal was der
            # Client sendet -- betrifft die API-Key-Authentifizierung unter /api/v1/*.
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            # Siehe Kommentar bei der map-Direktive oben -- ohne das bekommt PHP nie mit, dass
            # die Verbindung (über den externen Proxy) eigentlich HTTPS ist.
            fastcgi_param HTTPS $fastcgi_https;
            # Dynamische Antworten nie komprimieren (BREACH, siehe gzip-Kommentar oben).
            gzip off;
        }

        # Statische Assets direkt ausliefern -- aber falls die Datei nicht existiert (z.B.
        # /logo-light.png, /logo-dark.png, /favicon.ico, /assets/images/favicon-*.png,
        # /assets/images/apple-touch-icon.png, /assets/images/icon-*.png: das sind dynamische
        # PHP-Routen, keine echten Dateien unter public/), an den PHP-Router durchreichen statt
        # nginx' eigenes 404 auszuliefern. Ohne dieses try_files fing dieser Block jede
        # .png/.jpg/.ico-Anfrage ab, bevor sie "location /" und damit index.php überhaupt
        # erreichen konnte -- im Browser sichtbar als kaputtes Bild-Icon, obwohl die Datei über
        # /admin/templates korrekt hochgeladen war.
        location ~* \.(css|js|png|jpg|svg|ico|woff2?)$ {
            try_files $uri /index.php?$query_string;
            # Fällt die Anfrage auf index.php durch (dynamische Logos/Favicons), gelten die
            # Cache-Header, die PHP dort selbst setzt -- nicht die hier.
            add_header Cache-Control $static_cache_control;
            include /etc/nginx/security-headers.conf;
        }
    }
}
