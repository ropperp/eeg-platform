user www-data;
worker_processes auto;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 20M;
    # Versteckt "nginx/x.y.z" in Server-Headern/Fehlerseiten (Security-Review 25.09.2026) --
    # kein Sicherheitsgewinn im engeren Sinn, aber unnötige Versionspreisgabe an Angreifer/
    # automatisierte Scanner vermeiden (stand vorher offen sichtbar in externen Site-Checks).
    server_tokens off;

    # webapp terminiert selbst nie TLS -- das macht ausschließlich der externe nginx-Proxy
    # (10.0.0.144), der per proxy_set_header X-Forwarded-Proto https; weiterreicht.
    # $_SERVER['HTTPS'] in PHP (siehe Auth.php: session_set_cookie_params 'secure' =>
    # isset($_SERVER['HTTPS'])) war dadurch in Produktion IMMER leer, obwohl die Seite über
    # HTTPS läuft -- das Session-Cookie bekam nie das Secure-Flag (Security-Review 25.09.2026).
    # Bewusst per map statt fix "on", damit lokale Entwicklung über
    # docker-compose.override.yml (direkter Plain-HTTP-Zugriff ohne X-Forwarded-Proto) weiterhin
    # funktioniert, statt ein Secure-Cookie zu setzen, das der Browser über HTTP nie zurückschickt.
    map $http_x_forwarded_proto $fastcgi_https {
        default '';
        https   'on';
    }

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Security-Header (OWASP-Audit, 14.08.2026). CSP erlaubt bewusst 'unsafe-inline' für
        # style-src/script-src -- die App nutzt an sehr vielen Stellen inline style=""-Attribute
        # und inline <script>-Blöcke direkt in den Views; das ohne einen kompletten Umbau auf
        # Nonces/externe Dateien zu verbieten, hätte quer durchs ganze Frontend etwas kaputt
        # gemacht. Auch so bringt die CSP echten Nutzen: verbietet das Nachladen fremder
        # Skripte/Styles/Objekte, schränkt ein, wohin Formulare senden dürfen (form-action), und
        # verbietet Einbetten in ein fremdes iframe (frame-ancestors, zusammen mit
        # X-Frame-Options als Fallback für ältere Browser -- schützt vor Clickjacking).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        # Weitere Härtungs-Header (Security-Review 25.09.2026, externer Blackbox-Report F-09):
        # Permissions-Policy deaktiviert Browser-APIs, die diese App nirgends braucht (Kamera,
        # Mikro, Standort, ...) -- reduziert die Angriffsfläche, falls doch einmal fremder Code
        # eingeschleust werden könnte. Cross-Origin-Opener-Policy trennt das Browser-Tab von
        # fremden Fenstern/Tabs (schützt zusätzlich zu frame-ancestors gegen manche
        # Cross-Origin-Angriffe, z.B. Spectre-artige Seitenkanäle). Cross-Origin-Resource-Policy
        # verhindert, dass fremde Seiten unsere Ressourcen (Bilder, JSON) per <script>/<img>
        # einbetten -- "same-site" statt "same-origin", weil genau das für
        # portal./admin./live.stromfueralle.at (dieselbe Site, andere Subdomain) noch erlaubt
        # bleiben muss.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        # HSTS (Security-Review 25.09.2026, F-01). Ursprünglich fälschlich als externe
        # Proxy-Host-Aufgabe eingeordnet -- der Nachtest vom 25.09. hat aber bewiesen, dass
        # add_header-Zeilen von HIER (webapp) unverändert bis zum Browser durchkommen (siehe
        # Permissions-Policy/COOP/CORP oben, die im Nachtest bereits extern ankamen) -- der
        # externe nginx-Proxy reicht Response-Header beim proxy_pass einfach durch, es
        # brauchte also gar keine separate Änderung auf 10.0.0.144. Bewusst OHNE
        # "includeSubDomains": traefik.stromfueralle.at hängt aktuell noch mit falschem
        # Zertifikat in der Luft (siehe "Bekannte Probleme" weiter unten, F-04) und admin./
        # live.stromfueralle.at sind in der externen nginx-Proxy-Config bisher nicht explizit
        # dokumentiert -- HSTS mit includeSubDomains würde Browser zwingen, ALLE Subdomains nur
        # noch über HTTPS zu laden, auch eine, die (noch) gar kein gültiges Zertifikat hat. Erst
        # nachdem alle Subdomains bestätigt per HTTPS laufen, sollte includeSubDomains ergänzt
        # werden (dann ggf. auch "preload" erwägen -- das ist aber ein separater, quasi
        # unumkehrbarer Schritt und braucht eine bewusste Entscheidung, kein Automatismus).
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Health-Check
        location = /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # robots.txt / security.txt (RFC 9116) -- Security-Review 25.09.2026, F-08. Explizite
        # Content-Type-Zuweisung nötig: .txt steht nicht in mime.types, ohne das würde nginx
        # sonst den globalen default_type (application/octet-stream) ausliefern und Browser/Bots
        # böten die Datei zum Download an statt sie als Text zu interpretieren.
        location = /robots.txt {
            default_type text/plain;
        }
        location = /.well-known/security.txt {
            default_type text/plain;
        }

        # Alle Requests durch den PHP-Router
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            # nginx leitet den Authorization-Header NICHT automatisch an PHP-FPM weiter (auch
            # nicht über "include fastcgi_params" -- bekannte nginx+fastcgi-Falle). Ohne diese
            # Zeile käme $_SERVER['HTTP_AUTHORIZATION'] in PHP immer leer an, egal was der
            # Client sendet -- betrifft die API-Key-Authentifizierung unter /api/v1/*.
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            # Siehe Kommentar bei der map-Direktive oben -- ohne das bekommt PHP nie mit, dass
            # die Verbindung (über den externen Proxy) eigentlich HTTPS ist.
            fastcgi_param HTTPS $fastcgi_https;
        }

        # Statische Assets direkt ausliefern -- aber falls die Datei nicht existiert (z.B.
        # /logo-light.png, /logo-dark.png: das sind dynamische PHP-Routen, keine echten
        # Dateien unter public/), an den PHP-Router durchreichen statt nginx' eigenes 404
        # auszuliefern. Ohne dieses try_files fing dieser Block jede .png/.jpg-Anfrage ab,
        # bevor sie "location /" und damit index.php überhaupt erreichen konnte -- im Browser
        # sichtbar als kaputtes Bild-Icon, obwohl die Datei über /admin/templates korrekt
        # hochgeladen war.
        location ~* \.(css|js|png|jpg|svg|ico|woff2?)$ {
            try_files $uri /index.php?$query_string;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
