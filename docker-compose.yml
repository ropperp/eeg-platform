# Log-Rotation für ALLE Container: ohne diese Vorgabe schreibt Docker die Container-Logs
# unbegrenzt in json-Dateien -- auf einem Raspberry Pi mit SD-Karte kann das über Wochen die
# Platte volllaufen lassen, wodurch der ganze Host langsam einfriert (Schreibzugriffe hängen,
# Netzwerk/Ping antwortet aber noch -> "im Netz sichtbar, aber kein SSH mehr"). Max. 3 x 10 MB
# pro Container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Grundhärtung für Dienste mit Standard-Rechten (15.11.2026): no-new-privileges verhindert, dass ein
# Prozess im Container über setuid-Programme mehr Rechte bekommt; die abgelegten Linux-Capabilities
# braucht keiner dieser Dienste (rohe Netzwerk-Pakete, Geräteknoten anlegen, chroot, Datei-
# Capabilities setzen, Audit-Protokoll). Bewusst NICHT "alles abwerfen" (cap_drop: ALL) -- nginx/
# php-fpm, Redis und Mosquitto starten als root und wechseln selbst zu ihrem Dienstbenutzer, das
# braucht SETUID/SETGID/CHOWN. Die Datenbank bleibt unverändert (siehe docs/BETRIEBSHANDBUCH.md).
x-hardening: &base-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - NET_RAW
    - MKNOD
    - SETFCAP
    - SETPCAP
    - SYS_CHROOT
    - AUDIT_WRITE

services:

  # ─────────────────────────────────────────
  # Reverse Proxy + SSL (Let's Encrypt)
  # ─────────────────────────────────────────
  traefik:
    # Hauptversion fest (v3) statt ":latest": ein Neubau springt nie unbemerkt auf eine neue Hauptversion
    # mit geänderter Konfiguration. Für eine exakte Version/Digest: `docker compose images traefik` auf
    # dem Server und hier eintragen (siehe docs/BETRIEBSHANDBUCH.md, 15.11.2026).
    # Images mit Version + Digest fest (16.11.2026), Updates per Dependabot-PR.
    image: traefik:v3.7.19@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
    container_name: traefik
    restart: always
    logging: *default-logging
    # Traefik braucht nur Port 80 binden und seine Konfigurationsdatei lesen: alle Rechte außer
    # NET_BIND_SERVICE weg, Dateisystem schreibgeschützt (nur /tmp im Arbeitsspeicher).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    command:
      - "--api.insecure=false"
      - "--ping=true"
      # KEIN Docker-Provider mehr (15.11.2026): kein Dienst trägt noch Traefik-Labels, alle Router
      # stehen in der Datei unten. Damit braucht Traefik den Docker-Socket nicht mehr -- der ist
      # selbst als :ro-Mount ein Vollzugriff auf den Docker-Dienst des Servers (ein schreibgeschützter
      # Socket schützt nicht vor schreibenden API-Aufrufen); wer Traefik übernähme, hätte den
      # ganzen Server. Neue Dienste mit eigener Adresse also in dynamic.yml eintragen, nicht per Label.
      #
      # File-Provider für die webapp-Router (siehe docker/traefik/dynamic.yml) -- lebt
      # unabhängig vom webapp-Container, damit ein gestopptes/abgestürztes webapp ein
      # korrektes 502/503/504 statt eines nackten Traefik-404 liefert (Vorfall 25.09.2026,
      # siehe Kommentar in der Datei). watch=true übernimmt Änderungen ohne Neustart.
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      # X-Forwarded-For/X-Real-IP vom nginx-Proxy (SSL-Terminierung, 10.0.0.144) übernehmen
      # statt verwerfen -- sonst sieht die webapp nur Traefik bzw. den Proxy als Client und
      # speichert z.B. bei Beitrittserklärung/Vertragsunterschrift 172.19.0.3 statt der echten
      # Client-IP (Patrick, 07.11.2026). NUR diese eine Proxy-IP: von jedem anderen Absender
      # verwirft Traefik die Header weiterhin (Schutz gegen gefälschte IP-Angaben).
      - "--entrypoints.web.forwardedHeaders.trustedIPs=${TRUSTED_PROXY_IP:-10.0.0.144}"
    ports:
      - "80:80"
    volumes:
      - /opt/eeg/traefik/letsencrypt:/letsencrypt
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      # `--ping=true` aktiviert den internen /ping-Endpoint; `traefik healthcheck` fragt ihn ab.
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - eeg-net

  # ─────────────────────────────────────────
  # Datenbank — PostgreSQL 16 + TimescaleDB
  # ─────────────────────────────────────────
  timescaledb:
    # WICHTIG: Image auf feste Digest gepinnt. Der bewegliche Tag ":pg16" hat am 18.06.2026 im
    # Hintergrund eine neue Image-Version gezogen, die ihr Datenverzeichnis von
    # /var/lib/postgresql/data auf /home/postgres/pgdata/data verlegt hat -> der alte Bind-Mount
    # zeigte ins Leere, die DB lief auf flüchtigem Container-Speicher und war nach dem nächsten
    # Neu-Erstellen des Containers "weg" (Details: docs/INFRASTRUKTUR_PFADE.md). Feste Digest +
    # korrekter Mount unten verhindern das. Zum bewussten Aktualisieren: Digest neu setzen.
    image: timescale/timescaledb-ha:pg16@sha256:cbc43994559f407ebdf360f5254da044b05c65a2f8a8d18bc8119eef35ca5803
    container_name: timescaledb
    restart: always
    logging: *default-logging
    volumes:
      # Persistentes Datenverzeichnis. Muss auf das echte PGDATA des timescaledb-ha-Images
      # zeigen: /home/postgres/pgdata (PGDATA = /home/postgres/pgdata/data). NICHT auf
      # /var/lib/postgresql/data -- das benutzt dieses Image NICHT (siehe Kommentar am image
      # oben + docs/INFRASTRUKTUR_PFADE.md). Der Cluster liegt damit auf dem Host unter
      # /opt/eeg/timescaledb/data.
      - /opt/eeg/timescaledb:/home/postgres/pgdata
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - eeg-net

  # ─────────────────────────────────────────
  # Session-Cache
  # ─────────────────────────────────────────
  redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    container_name: redis
    restart: always
    logging: *default-logging
    <<: *base-hardening
    volumes:
      - /opt/eeg/redis:/data
      # Optionale redis.conf mit "requirepass" (siehe scripts/redis_secure_setup.sh) --
      # :ro, damit der Container sie nie selbst verändert. Existiert die Datei noch nicht
      # (frische Installation vor dem einmaligen Setup-Skript), lässt --loglevel warning davor
      # nichts fehlschlagen -- "include" einer fehlenden Datei ist bei Redis ein harter Fehler,
      # deshalb wird die Datei von setup.sh/redis_secure_setup.sh IMMER angelegt (notfalls leer).
      - /opt/eeg/redis-config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --save 60 1 --loglevel warning
    healthcheck:
      # -a aus $$REDIS_PASSWORD (doppeltes $$, damit Compose es nicht selbst interpoliert,
      # sondern die Shell IM Container zur Laufzeit) -- funktioniert unverändert, egal ob ein
      # Passwort gesetzt ist oder nicht (redis-cli ignoriert -a mit leerem Wert nicht ganz
      # sauber, deshalb sh -c mit bedingtem Aufbau).
      test: ["CMD-SHELL", "redis-cli $$( [ -n \"$$REDIS_PASSWORD\" ] && echo -a $$REDIS_PASSWORD ) ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - eeg-net

  # ─────────────────────────────────────────
  # MQTT Broker
  # ─────────────────────────────────────────
  mosquitto:
    # Version 2.1.2 (kein eigener Versions-Tag veröffentlicht, daher Tag "2" + Digest)
    image: eclipse-mosquitto:2@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
    container_name: mosquitto
    restart: always
    logging: *default-logging
    <<: *base-hardening
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # Zertifikate (TLS, Port 8883) und Passwort-Datei liegen NICHT im Git-Repo -- beide
      # enthalten Geheimnisse bzw. den privaten Schlüssel. Erzeugt/aktualisiert von
      # scripts/mqtt_secure_setup.sh, siehe docs/ESP_IDEEN.md.
      - /opt/eeg/mosquitto/certs:/mosquitto/certs:ro
      - /opt/eeg/mosquitto/passwd:/mosquitto/config/passwd:ro
      - /opt/eeg/mosquitto/data:/mosquitto/data
      - /opt/eeg/mosquitto/log:/mosquitto/log
    healthcheck:
      # Braucht seit allow_anonymous=false ebenfalls Zugangsdaten, sonst würde der
      # Healthcheck selbst fehlschlagen und mosquitto fälschlich als unhealthy melden.
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3", "-u", "${MQTT_USER}", "-P", "${MQTT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - eeg-net

  # ─────────────────────────────────────────
  # MQTT → TimescaleDB Subscriber (Python)
  # ─────────────────────────────────────────
  mqtt-subscriber:
    build: ./mqtt-subscriber
    container_name: mqtt-subscriber
    restart: always
    logging: *default-logging
    # Reiner Netzwerk-Client ohne Dateizugriff außer der Heartbeat-Datei in /tmp: als unprivilegierter
    # Benutzer, ohne jedes Linux-Recht, mit schreibgeschütztem Dateisystem.
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      # Seit dem TLS/Auth-Setup (scripts/mqtt_secure_setup.sh) verlangt der Broker Zugangsdaten
      # von JEDEM Client, auch intern -- TLS selbst ist hier nicht nötig (Container-zu-Container
      # im eigenen, isolierten Docker-Netz, nicht auf Port 1883/8883 nach außen exponiert).
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      DB_HOST: timescaledb
      DB_PORT: 5432
      # Eigenes Dienstkonto WORKER_DB_USER (kein Superuser, nur BYPASSRLS + Datenrechte; siehe
      # scripts/db_runtime_role_setup.sh). Der Dienst verarbeitet MQTT-Nachrichten aller
      # Communities und kennt die Community erst nach dem Nachschlagen, RLS würde ihn blockieren
      # (Vorfall 17.08.2026). Rückfall auf DB_USER, solange das Skript noch nicht gelaufen ist.
      DB_USER: ${WORKER_DB_USER:-${DB_USER}}
      DB_PASSWORD: ${WORKER_DB_PASSWORD:-${DB_PASSWORD}}
      DB_NAME: ${DB_NAME}
      # Für die Verschlüsselung des ESP-WLAN-Passworts (eeg/+/meter/+/status), gleicher
      # Schlüssel wie encryptSecret()/decryptSecret() in webapp/src/functions.php.
      APP_SECRET: ${APP_SECRET}
      # Standort für die Wetterdaten der Messe-Demo (simulierte PV-Einspeisung, siehe main.py).
      # Leer = Feldkirchen in Kärnten.
      MESSE_DEMO_LAT: ${MESSE_DEMO_LAT:-}
      MESSE_DEMO_LON: ${MESSE_DEMO_LON:-}
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    healthcheck:
      # Der Subscriber hat keinen HTTP-Endpunkt -> Heartbeat-Datei (main.py schreibt sie, solange
      # die MQTT-Verbindung steht). Gesund, wenn die Datei jünger als 90 s ist.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if os.path.exists('/tmp/mqtt_subscriber_healthy') and time.time()-os.path.getmtime('/tmp/mqtt_subscriber_healthy')<90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - eeg-net

  # ─────────────────────────────────────────
  # EDA-Worker — Netzbetreiber-Dateien importieren (Jobs aus eda_import_jobs)
  # Eigener Container seit 16.11.2026 (docs/adr/0005-eda-import-als-worker.md): ein großer Import
  # blockiert keine Web-Anfrage mehr, und das Webapp-Image braucht kein Python/pandas.
  # ─────────────────────────────────────────
  eda-worker:
    build: ./eda-parser
    container_name: eda-worker
    restart: always
    logging: *default-logging
    # Gleiche UID wie PHP (www-data, 82): liest die von der Webapp gespeicherten Uploads.
    user: "82:82"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      # Dienstkonto (BYPASSRLS, kein Superuser) wie mqtt-subscriber; Rückfall DB_USER.
      DB_USER: ${WORKER_DB_USER:-${DB_USER}}
      DB_PASSWORD: ${WORKER_DB_PASSWORD:-${DB_PASSWORD}}
    volumes:
      # Nur lesend: der Worker liest die hochgeladenen bzw. abgeholten Dateien, schreibt nur in die DB.
      - /opt/eeg/webapp-storage:/var/www/html/storage:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if os.path.exists('/tmp/eda_worker_healthy') and time.time()-os.path.getmtime('/tmp/eda_worker_healthy')<90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - eeg-net

  # ─────────────────────────────────────────
  # Webapplikation — nginx + PHP 8.4
  # ─────────────────────────────────────────
  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    container_name: webapp
    restart: always
    logging: *default-logging
    <<: *base-hardening
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      # production (Standard): die Webapp verbindet nur als eingeschränkte Rolle APP_DB_USER und
      # bricht sonst mit klarer Meldung ab (webapp/src/DB.php). Lokal setzt
      # docker-compose.override.yml APP_ENV=development.
      APP_ENV: ${APP_ENV:-production}
      APP_DB_USER: ${APP_DB_USER:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Leer = wie bisher unauthentifiziert (Rückwärtskompatibilität vor dem einmaligen
      # scripts/redis_secure_setup.sh, siehe Auth::start()). Auch für das Rate-Limiting
      # (login-Fehlversuche, siehe RateLimiter.php) genutzt.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LATEX_SERVICE_URL: http://latex-service:3210
      LATEX_API_KEY: ${LATEX_API_KEY}
      APP_SECRET: ${APP_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      DOMAIN: ${DOMAIN}
      # Optional, Standard aus DOMAIN abgeleitet (webapp/src/AppConfig.php): Portal-Host
      # (portal.<DOMAIN>) und Rückfall-Kontaktadresse (office@<DOMAIN>).
      PORTAL_HOST: ${PORTAL_HOST:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      # Nur zur Fehlersuche: 1 zeigt technische Details auf der Fehlerseite (sonst nur Fehlernummer).
      APP_DEBUG: ${APP_DEBUG:-}
      # Derselbe nginx-Proxy, dem Traefik oben vertraut -- clientIp() (functions.php)
      # überspringt ihn beim Auslesen von X-Forwarded-For.
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-10.0.0.144}
    volumes:
      # Persistente Ablage für Mitglieder-Uploads, Verträge, Beitrittserklärungen etc.
      # (vorher nur im Container — ging bei jedem --build verloren!)
      - /opt/eeg/webapp-storage:/var/www/html/storage
      # Gleiches Host-Verzeichnis wie beim latex-service (siehe dort) -- Platform-Admin kann
      # LaTeX-Vorlagen unter /admin/templates herunter-/hochladen, latex-service liest von
      # dort beim PDF-Rendern.
      - /opt/eeg/latex-templates:/var/www/html/latex-templates
      # NUR LESEND (:ro): die Backup-Übersicht unter /admin/backups zeigt an, ob die nächtliche
      # Sicherung wirklich läuft (Alter, Größe, Dateien). Bewusst read-only -- die Webapp soll
      # Backups anzeigen, aber niemals verändern oder löschen können.
      - ./backups:/var/www/html/backups:ro
    # Kein traefik.* Label mehr hier (Stand 25.09.2026) -- die Router/Services sind jetzt im
    # Traefik-File-Provider definiert (docker/traefik/dynamic.yml), damit sie unabhängig vom
    # Lebenszyklus dieses Containers bestehen bleiben. Grund + Vorfall siehe Kommentar dort.
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # nginx antwortet UND die DB-Rolle hebelt RLS nicht aus (webapp/bin/db_role_check.php).
      test: ["CMD-SHELL", "curl -fsS http://localhost/health >/dev/null && php /var/www/html/bin/db_role_check.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - eeg-net

  # ─────────────────────────────────────────
  # PDF-Generator (latex-service)
  # Dateien werden von Patrick geliefert
  # ─────────────────────────────────────────
  latex-service:
    build: ./latex-service
    container_name: latex-service
    restart: always
    logging: *default-logging
    <<: *base-hardening
    environment:
      API_KEY: ${LATEX_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      # Persistente Ablage der .tex-Vorlagen, damit ein Platform-Admin sie unter
      # /admin/templates herunter-/hochladen kann und Änderungen einen --build überleben
      # (sonst wären sie nur im Image, wie webapp-storage vor der Migration am 14.07.2026).
      # Bleibt das Verzeichnis auf dem Host leer (Erststart), kopiert der Entrypoint einmalig
      # die mitgelieferten Standard-Vorlagen hinein -- sonst startet latex-service ohne
      # jede Vorlage, weil das Volume das im Image gebackene ./templates verdeckt.
      - /opt/eeg/latex-templates:/app/templates
    healthcheck:
      # KEIN curl im Image (node:20-slim hat keins, siehe latex-service/Dockerfile) -- ein
      # curl-Healthcheck schlaegt hier IMMER fehl ("executable file not found"), unabhaengig
      # vom tatsaechlichen Zustand des Dienstes. Node 20 hat globales fetch() eingebaut,
      # das braucht keine zusaetzliche Abhaengigkeit.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3210/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - eeg-net

networks:
  eeg-net:
    driver: bridge
