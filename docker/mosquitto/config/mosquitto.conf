# TLS (Port 8883): selbstsigniertes Zertifikat + Benutzername/Passwort, siehe
# scripts/mqtt_secure_setup.sh -- Zertifikate/Passwort-Datei liegen NICHT im Git-Repo, sondern
# unter /opt/eeg/mosquitto/ (certs/, passwd), vom Setup-Skript einmalig erzeugt.
listener 1883
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Beide Listener (1883 unverschlüsselt, 8883 TLS) verlangen Benutzername/Passwort --
# ESP32-Geräte tragen das im /config-Formular ein (mqtt-benutzername/-passwort).
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type all
