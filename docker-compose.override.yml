# Lokale Entwicklung: webapp direkt auf Port 80, kein Traefik nötig.
# Für Produktion (echte Domain + Let's Encrypt): diese Datei löschen oder umbenennen.

services:
  traefik:
    profiles:
      - production   # nur mit --profile production starten

  webapp:
    environment:
      # Lokal darf die Webapp ohne eingeschränkte DB-Rolle laufen (siehe webapp/src/DB.php).
      APP_ENV: development
      # Rückfall-Zugang für die Entwicklung, falls APP_DB_USER (noch) fehlt.
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "80:80"
    labels:
      - "traefik.enable=false"
